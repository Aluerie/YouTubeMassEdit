[project]
name = "youtube-mass-edit"
version = "0.1.0"
description = "Mass-edit the shared parts of YouTube video descriptions in a playlist"
license = "MIT"
authors = [
    { name = "Aluerie", email = "aluerie@gmail.com" }
]
requires-python = ">=3.15"
dependencies = [
    "click>=8.5.1",
    "google-api-python-client>=2.202.0",
    "google-auth-oauthlib>=1.5.0",
]

[project.scripts]
youtube-mass-edit = "youtube_mass_edit.cli:cli"

[build-system]
requires = ["uv_build>=0.13.5,<0.14.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "google-api-python-client-stubs>=1.40.0",
    "pytest>=9.2.0",
    "ruff>=0.17.6",
    "ty>=0.0.108",
]

[tool.ruff]
line-length = 110
target-version = "py315"

[tool.ruff.lint]
select = ["ALL"]
ignore = [
    "D",       # docstrings: written where useful, not enforced everywhere
    "T201",    # print is the CLI's output
    "COM812",  # conflicts with the formatter
    "DTZ005",  # local time is what we want in backup filenames
    "CPY001",  # no copyright headers in a personal tool
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "PLR2004", "INP001"]

[tool.pytest]
testpaths = ["tests"]
